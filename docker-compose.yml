# Local development services for Rowta. Reads values from .env (create it with: node scripts/setup-env.mjs).
# Everything binds to 127.0.0.1 only, so nothing is reachable from other machines.
# Images: [VERIFY] current tags on Docker Hub before relying on them.
name: rowta

services:
  db0:
    # Global database AND shard 0 (PRD 7.1, 9.5)
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB0_NAME:?run node scripts/setup-env.mjs}
      POSTGRES_USER: ${DB0_USER:?run node scripts/setup-env.mjs}
      POSTGRES_PASSWORD: ${DB0_PASSWORD:?run node scripts/setup-env.mjs}
    ports:
      - "127.0.0.1:${DB0_PORT:?}:5432"
    volumes:
      - db0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  db1:
    # Shard 1
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB1_NAME:?run node scripts/setup-env.mjs}
      POSTGRES_USER: ${DB1_USER:?run node scripts/setup-env.mjs}
      POSTGRES_PASSWORD: ${DB1_PASSWORD:?run node scripts/setup-env.mjs}
    ports:
      - "127.0.0.1:${DB1_PORT:?}:5432"
    volumes:
      - db1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run node scripts/setup-env.mjs}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:?}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  mail:
    # Local mail catcher (nodemailer talks SMTP to this in development). Nothing leaves your computer.
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${SMTP_PORT:?}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:?}:8025"

volumes:
  db0-data:
  db1-data:
  redis-data:
